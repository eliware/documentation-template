version: "11.0"
description: Baseline documentation guidance for repositories created from this template.
directives:
  - id: E-10
    dos:
      - Use the repository root README.md as the documentation entry point and specs/README.md to index structured records.
      - Replace template-specific metadata and content with the derived repository's details.
    donts:
      - Do not leave template identity or placeholder content in a derived repository.
